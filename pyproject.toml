[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videobot-desktop"
version = "2.1.0"
description = "A durable desktop media download queue with source manifests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ShadowfetchStudio"}]
dependencies = ["PySide6-Essentials>=6.8,<7", "playwright>=1.50,<2", "yt-dlp[default]>=2026.11.23", "requests>=2.32.4,<3", "psutil>=6,<8"]

[project.scripts]
videobot = "videobot.cli:main"
videobot-desktop = "videobot.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9", "build>=1.2", "pip-audit>=2.7", "pyinstaller>=6"]

[tool.setuptools.packages.find]
include = ["videobot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]

name: Test and audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: brew install ffmpeg
      - run: python -m playwright install --with-deps chromium
      - run: ruff check videobot tests
      - run: ruff format --check videobot tests run.py
      - run: python -m pytest -v -o faulthandler_timeout=60 --junitxml=test-results.xml
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-macOS-arm64-3.12
          path: test-results.xml
  dependencies:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: pip-audit

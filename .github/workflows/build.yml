name: Desktop packages
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Bundle Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: python -m playwright install --only-shell chromium
      - name: Install media tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxcb-cursor0
      - name: Install media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install media tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python scripts/build.py
      - name: Exercise packaged browser and native download
        run: python scripts/package_smoke.py
      - name: Diagnose Linux packaged startup failure
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gdb
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 gdb -batch -ex run -ex 'thread apply all bt' --args dist/VideoBot/VideoBot --smoke-ui /tmp/videobot-debug.png > package-debug.log 2>&1 || true
          tail -100 package-debug.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-debug-${{ matrix.os }}
          path: package-debug.log
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VIDEOBOT_VERSION = python -c "from videobot import __version__; print(__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows.iss
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname VideoBot -srcfolder dist/VideoBot.app -ov -format UDZO dist/VideoBot-macOS.dmg
      - name: Linux portable archive
        if: runner.os == 'Linux'
        run: tar -czf dist/VideoBot-Linux.tar.gz -C dist VideoBot
      - name: Checksums
        shell: python
        run: |
          import hashlib,pathlib
          root=pathlib.Path('dist')
          files=[p for p in root.iterdir() if p.suffix in ('.exe','.dmg','.gz')]
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
      - uses: actions/upload-artifact@v4
        with:
          name: VideoBot-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS.txt

name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Bundle Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: python -m playwright install chromium
      - run: python scripts/build.py
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VIDEOBOT_VERSION = python -c "from videobot import __version__; print(__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows.iss
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname VideoBot -srcfolder dist/VideoBot.app -ov -format UDZO dist/VideoBot-macOS.dmg
      - name: Linux portable archive
        if: runner.os == 'Linux'
        run: tar -czf dist/VideoBot-Linux.tar.gz -C dist VideoBot
      - name: Checksums
        shell: python
        run: |
          import hashlib,pathlib
          root=pathlib.Path('dist')
          files=[p for p in root.iterdir() if p.suffix in ('.exe','.dmg','.gz')]
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
      - uses: actions/upload-artifact@v4
        with:
          name: VideoBot-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS.txt

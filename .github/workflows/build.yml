name: Desktop packages
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Bundle Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: python -m playwright install --only-shell chromium
      - run: brew install ffmpeg
      - name: Check architecture and release version
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(python -c 'from videobot import __version__; print(__version__)')"
          fi
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build.py
      - name: Exercise packaged playback, downloads, clipping and local transcription
        run: python scripts/package_smoke.py
      - name: macOS disk image
        run: hdiutil create -volname VideoBot -srcfolder dist/VideoBot.app -ov -format UDZO dist/VideoBot-2.3.0-macOS-arm64.dmg
      - name: Checksums
        shell: python
        run: |
          import hashlib,pathlib
          root=pathlib.Path('dist')
          files=[p for p in root.iterdir() if p.suffix in ('.exe','.dmg','.gz')]
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VideoBot-macOS-arm64
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
